<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NutriVision - AI Food Analyzer</title>

    <meta
      name="description"
      content="Aplikasi AI untuk mengenali makanan dan memberikan informasi nutrisi secara real-time"
    />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriVision" />

    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.ico" />

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
        </div>
        <h1 class="brand-text">Nutri<span class="brand-highlight">Vision</span></h1>
      </div>

      <div class="header-status">
        <span class="status-badge">
          <span id="status-text">Model AI Siap</span>
        </span>
      </div>
    </header>

    <main id="main-content"></main>
  </body>
</html>
